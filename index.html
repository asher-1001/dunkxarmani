<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNK x ARMANI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#FAFAFA] text-[#1A1A1A] min-h-screen py-16 px-6">

    <header class="mb-12 text-center">
        <h1 class="text-3xl md:text-4xl font-light tracking-widest uppercase mb-4">DUNK x ARMANI</h1>
        <div class="w-16 h-[1px] bg-stone-300 mx-auto"></div>
    </header>

    <nav class="flex flex-wrap justify-center gap-4 mb-12">
        <button onclick="renderCards('all')" class="px-4 py-1 text-sm uppercase hover:text-stone-500 transition">All</button>
        <button onclick="renderCards('ig')" class="px-4 py-1 text-sm uppercase hover:text-stone-500 transition">IG</button>
        <button onclick="renderCards('x')" class="px-4 py-1 text-sm uppercase hover:text-stone-500 transition">X</button>
        <button onclick="renderCards('tiktok')" class="px-4 py-1 text-sm uppercase hover:text-stone-500 transition">TikTok</button>
        <button onclick="renderCards('facebook')" class="px-4 py-1 text-sm uppercase hover:text-stone-500 transition">FB</button>
    </nav>

    <main id="link-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4 w-full max-w-4xl mx-auto">
    </main>

    <script>
        const mediaLinks = [
            { platform: "IG", user: "@dunknatachai", type: "PHOTO", isNew: true, url: "https://www.instagram.com/p/DUxcI9akw9y/?img_index=1", img: "https://www.instagram.com/p/DUxcI9akw9y/?img_index=1" },
            { platform: "IG", user: "@iconsiam", type: "REEL", isNew: true, url: "https://www.instagram.com/reels/DQL_norkhp6/", img: "https://scontent.cdninstagram.com/v/t51.82787-19/722447653_18597700702058865_661308968975137196_n.jpg?stp=dst-jpg_s150x150_tt6&_nc_cat=1&ccb=7-5&_nc_sid=f7ccc5&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy45NjAuQzMifQ%3D%3D&_nc_ohc=wqBhViY6KFkQ7kNvwGS6c2Z&_nc_oc=Adp0OOgzhNASjxOQJXhJvPi7VRQaYp_bIFym_fvow_1lgKBqSE1uAFMlVe7ulzbmi2UQrUWd-ROaNSsgjblQVHhe&_nc_zt=24&_nc_ht=scontent.cdninstagram.com&_nc_gid=iYWuDXSAZt6mnFEzXKPxBA&_nc_ss=7b6a8&oh=00_Af_xQfMxj1DaXCKfE4ZVoeAVMJiwpFh9fKewgzUcdM7Xlw&oe=6A43DB8E" },
            { platform: "X", user: "@dunknatachai", type: "PHOTO", isNew: false, url: "#", img: "https://placehold.co/100x100/EEE/999" },
            { platform: "TikTok", user: "@dunknatachai", type: "VIDEO", isNew: true, url: "#", img: "https://placehold.co/100x100/EEE/999" },
            { platform: "IG", user: "@dunknatachai", type: "REEL", isNew: true, url: "#", img: "https://placehold.co/100x100/EEE/999" },
            { platform: "FB", user: "@dunknatachai", type: "PHOTO", isNew: false, url: "#", img: "https://placehold.co/100x100/EEE/999" }
        ];

        function renderCards(filter) {
            const grid = document.getElementById('link-grid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? mediaLinks : mediaLinks.filter(item => item.platform.toLowerCase() === filter);
            
            filtered.forEach(item => {
                grid.innerHTML += `
                    <a href="${item.url}" target="_blank" class="flex items-center justify-between bg-white border border-stone-200 rounded-full px-4 py-2 hover:border-stone-400 transition-all duration-300">
                        <div class="flex items-center gap-3">
                            <img src="${item.img}" class="w-10 h-10 rounded-full object-cover shrink-0">
                            <div class="flex flex-col">
                                <div class="flex items-center gap-1.5 text-sm font-semibold">
                                    <span class="text-[10px] bg-stone-100 px-1.5 py-0.5 rounded">${item.platform}</span>
                                    ${item.user}
                                </div>
                                <span class="text-[10px] text-stone-500 uppercase">${item.type}</span>
                            </div>
                        </div>
                        ${item.isNew ? '<span class="text-[10px] text-orange-600 font-bold mr-2">★ NEW</span>' : ''}
                    </a>
                `;
            });
        }

        renderCards('all');
    </script>
</body>
</html>
