<!DOCTYPE html>

<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dunk X SiBloom</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>

        body { font-family: 'Inter', sans-serif; }

    </style>

</head>

<body class="bg-[#FAFAFA] text-[#1A1A1A] min-h-screen py-16 px-6">



    <header class="mb-12 text-center">

        <h1 class="text-3xl md:text-4xl font-light tracking-widest uppercase mb-4">Dunk X SiBloom</h1>

        <div class="w-16 h-[1px] bg-stone-300 mx-auto"></div>

    </header>



    <nav class="flex flex-wrap justify-center gap-4 mb-12">

        <button onclick="renderCards('all')" class="px-4 py-1 text-sm uppercase hover:text-stone-500 transition">All</button>

        <button onclick="renderCards('ig')" class="px-4 py-1 text-sm uppercase hover:text-stone-500 transition">IG</button>

        <button onclick="renderCards('x')" class="px-4 py-1 text-sm uppercase hover:text-stone-500 transition">X</button>

        <button onclick="renderCards('tiktok')" class="px-4 py-1 text-sm uppercase hover:text-stone-500 transition">TikTok</button>

        <button onclick="renderCards('facebook')" class="px-4 py-1 text-sm uppercase hover:text-stone-500 transition">FB</button>

         <button onclick="renderCards('article')" class="px-4 py-1 text-sm uppercase hover:text-stone-500 transition">Article</button>

    </nav>



    <main id="link-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4 w-full max-w-4xl mx-auto">

    </main>



    <script>

        const mediaLinks = [

            { platform: "IG", user: "@armanibeauty", type: "REEL", isNew: true, url: "https://www.instagram.com/reel/DaC-1LOMT-i/", img: "https://yt3.googleusercontent.com/vG35Fc2VrAfC7hSeJuOaCrHQGf2ckFuUnAHTcGYIqHbHhAL20B8oyLg_qzq_YbVxinzESyoJtVE=s900-c-k-c0x00ffffff-no-rj" },

            { platform: "TIKTOK", user: "@armanibeauty", type: "VIDEO", isNew: true, url: "https://www.tiktok.com/@armanibeauty/video/7655658732730191136?is_from_webapp=1", img: "https://yt3.googleusercontent.com/vG35Fc2VrAfC7hSeJuOaCrHQGf2ckFuUnAHTcGYIqHbHhAL20B8oyLg_qzq_YbVxinzESyoJtVE=s900-c-k-c0x00ffffff-no-rj" },

            { platform: "X", user: "@ELLEThailand", type: "PHOTO", isNew: true, url: "https://x.com/ellethailand/status/2070462511674171749", img: "https://pbs.twimg.com/profile_images/1988682146098409472/-wV8Ovst_400x400.jpg" },

            { platform: "IG", user: "@ellebeautythailand", type: "PHOTO", isNew: true, url: "https://www.instagram.com/p/DaC_A4-ic63/?img_index=1", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSF2NAqNrA0OaIvhFZ00c1Yj_wQGC5Z6TRcAieWPdfQWetbM_kBmSvUtiQ&s=10" },

            { platform: "X", user: "@SECRET_Styled", type: "VIDEO", isNew: true, url: "https://x.com/SECRET_Styled/status/2070462604473168122", img: "https://pbs.twimg.com/profile_images/2004246500487155712/SuNzQI7w_400x400.jpg" },
            
            { platform: "X", user: "@girlngloss", type: "PHOTO", isNew: true, url: "https://x.com/girlngloss/status/2070462078230348263", img: "https://pbs.twimg.com/profile_images/2018164743815753728/NIgRcrxW_400x400.jpg" },

             { platform: "X", user: "@gangwayth", type: "PHOTO", isNew: true, url: "https://x.com/gangwayth/status/2070466646519771551?s=20", img: "https://pbs.twimg.com/profile_images/2065241423864311808/TL9BR9bn_400x400.jpg" },

             { platform: "X", user: "@ELLEThailand", type: "PHOTO", isNew: true, url: "https://x.com/ELLEThailand/status/2070470079532372430", img: "https://pbs.twimg.com/profile_images/1988682146098409472/-wV8Ovst_400x400.jpg" },

             { platform: "IG", user: "@bazaarthailand", type: "PHOTO", isNew: true, url: "https://www.instagram.com/p/DaC_EUyE1ru/", img: "https://pbs.twimg.com/profile_images/1775782143383511040/iLZ32G62_400x400.jpg" },

            { platform: "X", user: "@voguebeautyTH", type: "article", isNew: true, url: "https://x.com/voguebeautyTH/status/2070465484563292342", img: "https://pbs.twimg.com/profile_images/1717734850252419072/M64JaTS9_400x400.jpg" },



        ];



        function renderCards(filter) {

            const grid = document.getElementById('link-grid');

            grid.innerHTML = '';

            

           const filtered = filter === 'all' ? mediaLinks : mediaLinks.filter(item => {

    let platform = item.platform.toLowerCase();

    // เพิ่มเงื่อนไขพิเศษสำหรับ FB

    if (filter === 'facebook') return platform === 'fb';

    return platform === filter;

});

            

            filtered.forEach(item => {

                grid.innerHTML += `

                    <a href="${item.url}" target="_blank" class="flex items-center justify-between bg-white border border-stone-200 rounded-full px-4 py-2 hover:border-stone-400 transition-all duration-300">

                        <div class="flex items-center gap-3">

                            <img src="${item.img}" class="w-10 h-10 rounded-full object-cover shrink-0">

                            <div class="flex flex-col">

                                <div class="flex items-center gap-1.5 text-sm font-semibold">

                                    <span class="text-[10px] bg-stone-100 px-1.5 py-0.5 rounded">${item.platform}</span>

                                    ${item.user}

                                </div>

                                <span class="text-[10px] text-stone-500 uppercase">${item.type}</span>

                            </div>

                        </div>

                        ${item.isNew ? '<span class="text-[10px] text-red-600 font-bold mr-2">★ NEW</span>' : ''}

                    </a>

                `;

            });

        }



        renderCards('all');

    </script>

</body>

</html>
